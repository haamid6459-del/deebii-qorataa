<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deebii Qorataa</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6f8;
  color:#17202a;
}

header{
  background:#075e54;
  color:white;
  text-align:center;
  padding:25px 15px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:8px 0 0;
}

.container{
  max-width:850px;
  margin:auto;
  padding:18px;
}

.box,.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 15px #0001;
}

textarea{
  width:100%;
  min-height:140px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  font-size:17px;
  outline:none;
}

textarea:focus{
  border-color:#075e54;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-size:15px;
  cursor:pointer;
}

.search{
  background:#075e54;
  color:white;
  flex:1;
}

.photo{
  background:#e5f4f1;
  color:#075e54;
}

.clear{
  background:#eee;
}

#file{
  display:none;
}

#preview{
  max-width:100%;
  max-height:300px;
  display:none;
  margin-top:15px;
  border-radius:12px;
}

.loading{
  display:none;
  text-align:center;
  padding:20px;
  color:#075e54;
}

.source{
  border-left:4px solid #075e54;
  background:#f7faf9;
  padding:12px;
  margin:12px 0;
  border-radius:8px;
}

.source a{
  color:#075e54;
  text-decoration:none;
  font-weight:bold;
}

.copy{
  background:#075e54;
  color:white;
}

.error{
  color:#a00000;
}

.history{
  background:#fafafa;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  cursor:pointer;
}

footer{
  text-align:center;
  color:#777;
  padding:20px;
}
</style>
</head>

<body>

<header>
<h1>📚 Deebii Qorataa</h1>
<p>Gaaffii barreessi ykn suuraa galchi</p>
</header>

<div class="container">

<div class="box">

<textarea
id="question"
placeholder="Gaaffii kee asitti barreessi...">
</textarea>

<input
id="file"
type="file"
accept="image/*">

<img
id="preview">

<div class="buttons">

<button
class="photo"
onclick="document.getElementById('file').click()">
📷 Suuraa Galchi
</button>

<button
class="search"
onclick="searchQuestion()">
🔎 Barbaadi
</button>

<button
class="clear"
onclick="clearAll()">
🗑️ Haqi
</button>

</div>

</div>

<div
class="loading"
id="loading">
⏳ Maddoota barbaadaa jira...
</div>

<div id="answer"></div>

<div class="card">

<h2>🕘 Seenaa Barbaachaa</h2>

<div id="history"></div>

</div>

</div>

<footer>
Deebii Qorataa © 2026
</footer>


<script>

/* =========================
   VARIABLES
========================= */

const question =
document.getElementById("question");

const fileInput =
document.getElementById("file");

const preview =
document.getElementById("preview");

const answer =
document.getElementById("answer");

const loading =
document.getElementById("loading");

const historyBox =
document.getElementById("history");


/* =========================
   IMAGE PREVIEW
========================= */

fileInput.addEventListener(
"change",
function(){

const file=this.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(e){

preview.src=e.target.result;

preview.style.display="block";

};

reader.readAsDataURL(file);

});


/* =========================
   MAIN SEARCH
========================= */

async function searchQuestion(){

let q=question.value.trim();

if(!q){

alert("Mee gaaffii barreessi.");

return;

}

loading.style.display="block";

answer.innerHTML="";


try{

/* Wikipedia search */

const searchURL=
"https://en.wikipedia.org/w/rest.php/v1/search/page?q="
+
encodeURIComponent(q)
+
"&limit=8";


const response=
await fetch(searchURL);


if(!response.ok){

throw new Error(
"Search hin milkoofne."
);

}


const data=
await response.json();


const pages=
data.pages || [];


if(pages.length===0){

answer.innerHTML=`

<div class="card">

<h2>❌ Deebiin hin argamne</h2>

<p>
Gaaffii kanaaf madda walqabatu
hin argamne.
</p>

</div>

`;

return;

}


/* Get summaries */

let results=[];


for(
let page of pages.slice(0,6)
){

try{

const url=
"https://en.wikipedia.org/api/rest_v1/page/summary/"
+
encodeURIComponent(page.title);

const r=
await fetch(url);

if(r.ok){

const d=
await r.json();

results.push(d);

}

}catch(e){}

}


/* Show */

showResults(q,results);


/* History */

saveHistory(q);

loadHistory();


}catch(error){

answer.innerHTML=`

<div class="card error">

<h2>❌ Rakkoo</h2>

<p>
Internet ykn search irratti rakkoon uumame.
</p>

</div>

`;

}finally{

loading.style.display="none";

}

}


/* =========================
   SHOW RESULTS
========================= */

function showResults(q,results){

let html=`

<div class="card">

<h2>🔎 Gaaffii</h2>

<p>
${escapeHTML(q)}
</p>

</div>

<div class="card">

<h2>📚 Maddoota Argaman</h2>

`;


results.forEach(
(item,index)=>{

let title=
item.title || "Madda";

let text=
item.extract ||
"Ibsi hin argamne.";

let link="#";

if(
item.content_urls &&
item.content_urls.desktop
){

link=
item.content_urls.desktop.page;

}


html+=`

<div class="source">

<strong>
${index+1}. ${escapeHTML(title)}
</strong>

<p>
${escapeHTML(text)}
</p>

<a
href="${link}"
target="_blank">
🔗 Madda Bana
</a>

</div>

`;

});


html+=`

</div>

<div class="card">

<h2>💡 Deebii Walitti Qabame</h2>

<p>
Maddoota armaan olii irraa odeeffannoo
walqabatu argameera. Madda tokko qofaan
murtii hin kennin; maddoota dubbisiitii
odeeffannoo walbira qabi.
</p>

<button
class="copy"
onclick="copyAnswer()">
📋 Koppii Godhi
</button>

</div>

`;


answer.innerHTML=html;

}


/* =========================
   COPY
========================= */

function copyAnswer(){

const text=
answer.innerText;

navigator.clipboard
.writeText(text)
.then(()=>{

alert(
"Deebiin koppii godhame."
);

});

}


/* =========================
   HISTORY
========================= */

function saveHistory(q){

let history=
JSON.parse(
localStorage.getItem(
"deebii_qorataa_history"
) || "[]"
);


history.unshift(q);


history=
[...new Set(history)]
.slice(0,20);


localStorage.setItem(
"deebii_qorataa_history",
JSON.stringify(history)
);

}


function loadHistory(){

let history=
JSON.parse(
localStorage.getItem(
"deebii_qorataa_history"
) || "[]"
);


if(history.length===0){

historyBox.innerHTML=
"<p>Seenaa barbaachaa hin jiru.</p>";

return;

}


historyBox.innerHTML="";


history.forEach(q=>{

let div=
document.createElement("div");

div.className="history";

div.textContent=
"🔎 "+q;

div.onclick=function(){

question.value=q;

searchQuestion();

};

historyBox.appendChild(div);

});

}


/* =========================
   CLEAR
========================= */

function clearAll(){

question.value="";

fileInput.value="";

preview.src="";

preview.style.display="none";

answer.innerHTML="";

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadHistory();

</script>

</body>
  </html>
