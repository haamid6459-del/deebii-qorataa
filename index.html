<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deebii Qorataa</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#172033;
}

header{
  background:#075e54;
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:8px 0 0;
}

.container{
  max-width:850px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

textarea{
  width:100%;
  min-height:130px;
  border:1px solid #ccd3dc;
  border-radius:12px;
  padding:14px;
  font-size:17px;
  resize:vertical;
  outline:none;
}

textarea:focus{
  border-color:#075e54;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 17px;
  font-size:16px;
  cursor:pointer;
  background:#075e54;
  color:white;
}

button.secondary{
  background:#64748b;
}

button.danger{
  background:#b91c1c;
}

button:disabled{
  opacity:.5;
}

input[type=file]{
  width:100%;
  margin-top:10px;
}

#preview{
  max-width:100%;
  max-height:300px;
  display:none;
  margin-top:15px;
  border-radius:12px;
}

#status{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
  background:#e0f2fe;
}

#answer{
  white-space:pre-wrap;
  line-height:1.8;
  font-size:17px;
}

.source{
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}

.source h3{
  margin:0 0 7px;
  font-size:17px;
}

.source a{
  color:#075e54;
  word-break:break-word;
}

.history-item{
  background:#f8fafc;
  padding:10px;
  margin-top:8px;
  border-radius:9px;
  cursor:pointer;
}

.history-item:hover{
  background:#e2e8f0;
}

.small{
  color:#64748b;
  font-size:14px;
}

footer{
  text-align:center;
  padding:25px;
  color:#64748b;
}
</style>
</head>

<body>

<header>
  <h1>📚 Deebii Qorataa</h1>
  <p>Gaaffii kee barreessi ykn suuraa galchi</p>
</header>

<div class="container">

  <div class="card">

    <h2>🔎 Gaaffii kee</h2>

    <textarea
      id="question"
      placeholder="Fakkeenyaaf: Salaanni maal? Yoom dirqama godhame?"
    ></textarea>

    <h3>📷 Suuraa gaaffii</h3>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
    >

    <img id="preview">

    <div class="buttons">

      <button onclick="searchQuestion()">
        🔎 Barbaadi
      </button>

      <button
        class="secondary"
        onclick="clearQuestion()">
        🗑️ Haqi
      </button>

    </div>

    <div id="status"></div>

  </div>


  <div class="card">

    <h2>🤖 Deebii</h2>

    <div id="answer">
      Deebiin kee asitti mul'ata.
    </div>

    <div class="buttons">

      <button
        class="secondary"
        onclick="copyAnswer()">
        📋 Copy
      </button>

    </div>

  </div>


  <div class="card">

    <h2>📚 Maddoota Argaman</h2>

    <div id="sources">
      Maddoonni asitti mul'atu.
    </div>

  </div>


  <div class="card">

    <h2>🕘 Seenaa Gaaffii</h2>

    <div id="history"></div>

    <button
      class="danger"
      onclick="clearHistory()">
      Seenaa Haqi
    </button>

  </div>

</div>

<footer>
  Deebii Qorataa © 2026
</footer>


<script>

const questionInput =
  document.getElementById("question");

const imageInput =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

const answerBox =
  document.getElementById("answer");

const sourcesBox =
  document.getElementById("sources");

const statusBox =
  document.getElementById("status");


/* =========================
   SUURAA
========================= */

imageInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file){
    preview.style.display = "none";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    preview.src = e.target.result;

    preview.style.display = "block";

  };

  reader.readAsDataURL(file);

});


/* =========================
   STATUS
========================= */

function showStatus(text){

  statusBox.style.display = "block";

  statusBox.innerText = text;

}


/* =========================
   BARBAACHA
========================= */

async function searchQuestion(){

  const question =
    questionInput.value.trim();

  if(!question){

    alert(
      "Maaloo gaaffii kee Afaan Oromoo barreessi."
    );

    return;
  }

  showStatus(
    "⏳ Maddoota garaagaraa irraa barbaadaa jira..."
  );

  answerBox.innerText =
    "⏳ Mee xiqqoo eegi...";

  sourcesBox.innerHTML =
    "";

  try{

    const results =
      await searchSources(question);

    if(results.length === 0){

      answerBox.innerText =
        "Odeeffannoo gahaa hin argamne.";

      showStatus(
        "❌ Maddi odeeffannoo hin argamne."
      );

      return;
    }

    /*
      Odeeffannoo maddoota garaagaraa
      walitti qabu.
    */

    let combined = "";

    results.forEach((item,index)=>{

      combined +=
        (index+1) +
        ". " +
        item.title +
        "\n" +
        item.text +
        "\n\n";

    });


    /*
      Deebii gabaabaa uumuu.
      Backend yoo walitti hidhame,
      bakka kana AI deebii dhugaa kenna.
    */

    const answer =
      makeSimpleAnswer(
        question,
        results
      );

    answerBox.innerText =
      answer;


    displaySources(results);

    saveHistory(question);

    showStatus(
      "✅ Barbaacha xumurame."
    );

  }catch(error){

    console.error(error);

    answerBox.innerText =
      "Rakkoon uumame. Mee internet kee ilaali.";

    showStatus(
      "❌ Barbaacha irratti rakkoon uumame."
    );

  }

}


/* =========================
   WIKIPEDIA
========================= */

async function searchWikipedia(question){

  const url =
    "https://en.wikipedia.org/w/rest.php/v1/search/page?q=" +
    encodeURIComponent(question) +
    "&limit=5";

  const response =
    await fetch(url);

  if(!response.ok){
    return [];
  }

  const data =
    await response.json();

  const pages =
    data.pages || [];

  return pages.map(page=>({

    title:
      page.title,

    text:
      page.description ||
      "Ibsi gahaan hin argamne.",

    url:
      "https://en.wikipedia.org/wiki/" +
      encodeURIComponent(
        page.title.replace(/ /g,"_")
      ),

    source:
      "Wikipedia"

  }));

}


/* =========================
   WIKIPEDIA OROMOO
========================= */

async function searchOromoWikipedia(question){

  const url =
    "https://om.wikipedia.org/w/rest.php/v1/search/page?q=" +
    encodeURIComponent(question) +
    "&limit=5";

  try{

    const response =
      await fetch(url);

    if(!response.ok){
      return [];
    }

    const data =
      await response.json();

    const pages =
      data.pages || [];

    return pages.map(page=>({

      title:
        page.title,

      text:
        page.description ||
        "Ibsi hin argamne.",

      url:
        "https://om.wikipedia.org/wiki/" +
        encodeURIComponent(
          page.title.replace(/ /g,"_")
        ),

      source:
        "Wikipedia Afaan Oromoo"

    }));

  }catch(error){

    return [];

  }

}


/* =========================
   MADDOOTA HEDDUU
========================= */

async function searchSources(question){

  const all = [];

  try{

    const en =
      await searchWikipedia(question);

    all.push(...en);

  }catch(e){}


  try{

    const om =
      await searchOromoWikipedia(question);

    all.push(...om);

  }catch(e){}


  /*
    Maddoota wal fakkaatan
    maqaa irratti hundaa'uun haqi.
  */

  const unique = [];

  const seen =
    new Set();

  for(const item of all){

    const key =
      item.title.toLowerCase();

    if(!seen.has(key)){

      seen.add(key);

      unique.push(item);

    }

  }

  return unique.slice(0,8);

}


/* =========================
   DEEBII WALITTI QABUU
========================= */

function makeSimpleAnswer(question,results){

  let text =
    "Gaaffii: " +
    question +
    "\n\n";

  text +=
    "Odeeffannoo maddoota garaagaraa irraa argame:\n\n";

  results.slice(0,5).forEach((item,index)=>{

    text +=
      "• " +
      item.title +
      ": " +
      item.text +
      "\n\n";

  });

  text +=
    "Hubachiisa: Deebiin kun odeeffannoo maddoota armaan olii irraa walitti qabame. Odeeffannoo murteessaa ta'eef madda isaa sirriitti ilaali.";

  return text;

}


/* =========================
   MADDOOTA AGARSIISUU
========================= */

function displaySources(results){

  sourcesBox.innerHTML = "";

  results.forEach((item,index)=>{

    const div =
      document.createElement("div");

    div.className =
      "source";

    div.innerHTML = `

      <h3>
        ${index+1}. ${escapeHtml(item.title)}
      </h3>

      <p>
        ${escapeHtml(item.text)}
      </p>

      <div class="small">
        Madda: ${escapeHtml(item.source)}
      </div>

      <br>

      <a
        href="${item.url}"
        target="_blank"
        rel="noopener">
        🔗 Madda ilaali
      </a>

    `;

    sourcesBox.appendChild(div);

  });

}


/* =========================
   COPY
========================= */

async function copyAnswer(){

  const text =
    answerBox.innerText;

  try{

    await navigator.clipboard.writeText(text);

    alert(
      "✅ Deebiin copy godhame."
    );

  }catch(error){

    alert(
      "Copy gochuun hin danda'amne."
    );

  }

}


/* =========================
   HAQI
========================= */

function clearQuestion(){

  questionInput.value = "";

  imageInput.value = "";

  preview.src = "";

  preview.style.display =
    "none";

  answerBox.innerText =
    "Deebiin kee asitti mul'ata.";

  sourcesBox.innerHTML =
    "Maddoonni asitti mul'atu.";

  statusBox.style.display =
    "none";

}


/* =========================
   HISTORY
========================= */

function saveHistory(question){

  let history =
    JSON.parse(
      localStorage.getItem(
        "deebii_qorataa_history"
      ) || "[]"
    );

  history =
    history.filter(
      item => item !== question
    );

  history.unshift(question);

  history =
    history.slice(0,20);

  localStorage.setItem(
    "deebii_qorataa_history",
    JSON.stringify(history)
  );

  displayHistory();

}


function displayHistory(){

  const box =
    document.getElementById(
      "history"
    );

  const history =
    JSON.parse(
      localStorage.getItem(
        "deebii_qorataa_history"
      ) || "[]"
    );

  box.innerHTML = "";

  if(history.length === 0){

    box.innerHTML =
      "<p class='small'>Seenaa hin jiru.</p>";

    return;

  }

  history.forEach(item=>{

    const div =
      document.createElement("div");

    div.className =
      "history-item";

    div.innerText =
      "🔎 " + item;

    div.onclick = function(){

      questionInput.value =
        item;

      searchQuestion();

    };

    box.appendChild(div);

  });

}


function clearHistory(){

  localStorage.removeItem(
    "deebii_qorataa_history"
  );

  displayHistory();

}


/* =========================
   HTML SECURITY
========================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   JALQABA
========================= */

displayHistory();

</script>

</body>
    </html>
